stages:
  - test_and_codequality
  - coverage_and_mutation
  - docker_build
  - deploy

code_quality:
  stage: test_and_codequality
  image: python:3.11-slim
  before_script:
    - pip install pylint
  script:
    - pylint --rcfile=.pylintrc $(find . -name "*.py" | grep -v "^./tests") --fail-under=3.4 | tee pylint_report.txt | tail -n 4
  artifacts:
    paths:
      - pylint_report.txt
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

tests:
  stage: test_and_codequality
  image: python:3.11-slim
  before_script:
    - pip install pytest
  script:
    - pytest --ignore=kano-core --maxfail=1 --disable-warnings --junitxml=test-report.xml
  artifacts:
    paths:
      - test-report.xml
    reports:
      junit: test-report.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

test_coverage:
  stage: coverage_and_mutation
  image: python:3.11-slim
  before_script:
    - pip install pytest-cov pytest
  script:
    - pytest --ignore=kano-core --cov=. --cov-report=html --cov-report=term
  artifacts:
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

docker_build:
  stage: docker_build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        TAGS="--tag $CI_REGISTRY_IMAGE:main --tag $CI_REGISTRY_IMAGE:sandbox --tag $CI_REGISTRY_IMAGE:$CI_PIPELINE_IID --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      elif [ "$CI_COMMIT_BRANCH" == "develop" ]; then
        TAGS="--tag $CI_REGISTRY_IMAGE:develop --tag $CI_REGISTRY_IMAGE:test --tag $CI_REGISTRY_IMAGE:$CI_PIPELINE_IID --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
      docker build $TAGS .
      docker push --all-tags $CI_REGISTRY_IMAGE
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
      when: on_success

.deploy_template: &deploy_template
  script:
    - echo "Deploying to $CI_ENVIRONMENT_NAME"
    - export DOCKER_IMAGE_NAME_WITH_TAG=$CI_REGISTRY_IMAGE:$DEPLOY_TAG

deploy_aws_dev:
  stage: deploy
  extends: .deploy_template
  image: amazon/aws-cli
  variables:
    DEPLOY_TAG: "develop"
  environment:
    name: development/aws
    url: http://dev.aws.example.com
  script:
    - echo "Deploying to AWS Development environment..."
    - sed -i "s|__DOCKER_IMAGE_NAME__|$CI_REGISTRY_IMAGE:$DEPLOY_TAG|g" task-definition.json
    - aws ecs register-task-definition --cli-input-json file://task-definition.json
    - aws ecs update-service --cluster $DEV_ECS_CLUSTER_NAME --service $DEV_ECS_SERVICE_NAME --task-definition my-app
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true

deploy_azure_dev:
  stage: deploy
  extends: .deploy_template
  image: mcr.microsoft.com/azure-cli
  variables:
    DEPLOY_TAG: "develop"
  environment:
    name: development/azure
    url: http://dev.azure.example.com
  script:
    - echo "Deploying to Azure Development environment..."
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az webapp config container set --name $DEV_AZURE_APP_NAME --resource-group $DEV_AZURE_RESOURCE_GROUP --docker-custom-image-name "$CI_REGISTRY_IMAGE:$DEPLOY_TAG" --docker-registry-server-user $CI_REGISTRY_USER --docker-registry-server-password $CI_REGISTRY_PASSWORD
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true

deploy_aws_sandbox:
  stage: deploy
  extends: .deploy_template
  image: amazon/aws-cli
  variables:
    DEPLOY_TAG: "main"
  environment:
    name: sandbox/aws
    url: http://sandbox.aws.example.com
  script:
    - echo "Deploying to AWS Sandbox environment..."
    - sed -i "s|__DOCKER_IMAGE_NAME__|$CI_REGISTRY_IMAGE:$DEPLOY_TAG|g" task-definition.json
    - aws ecs register-task-definition --cli-input-json file://task-definition.json
    - aws ecs update-service --cluster $SANDBOX_ECS_CLUSTER_NAME --service $SANDBOX_ECS_SERVICE_NAME --task-definition my-app
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

deploy_azure_sandbox:
  stage: deploy
  extends: .deploy_template
  image: mcr.microsoft.com/azure-cli
  variables:
    DEPLOY_TAG: "main"
  environment:
    name: sandbox/azure
    url: http://sandbox.azure.example.com
  script:
    - echo "Deploying to Azure Sandbox environment..."
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az webapp config container set --name $SANDBOX_AZURE_APP_NAME --resource-group $SANDBOX_AZURE_RESOURCE_GROUP --docker-custom-image-name "$CI_REGISTRY_IMAGE:$DEPLOY_TAG" --docker-registry-server-user $CI_REGISTRY_USER --docker-registry-server-password $CI_REGISTRY_PASSWORD
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
